name: Docker

# Builds the image at a release's tag, for amd64 and arm64 (NAS boxes are
# often ARM), and pushes it to Docker Hub as jzheaux/reader:X.Y.Z. Only the
# newest vX.Y.Z tag also moves :latest and writes docs/docker.md as the
# overview, so pushing an older release leaves both alone. Called by the
# release workflow once it has tagged, since a tag it pushes starts no
# workflow of its own; or run by hand for a release that never reached
# Docker Hub. A version already there fails and is left as it is, so that
# an image people have pulled can't change under them.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Released version not yet on Docker Hub, as tagged without its v (e.g. 0.0.1)
        required: true

permissions:
  contents: read

concurrency:
  group: docker
  cancel-in-progress: false

env:
  IMAGE: jzheaux/reader
  VERSION: ${{ inputs.version }}

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' isn't a version like 0.0.1"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - id: tag
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The check is the workflow's own, not the release's, which may be
      # older than it: an older tag has no .github/scripts/ to run. The
      # image's build leaves this directory out (.dockerignore).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workflow
          sparse-checkout: .github/scripts
          persist-credentials: false

      # The checkout has only this tag, so ask the remote for the rest; it
      # also has the tag the release workflow has only just made.
      - name: Check whether it's the newest release
        id: newest
        run: workflow/.github/scripts/newest-release.sh "$VERSION"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check it isn't already pushed
        run: workflow/.github/scripts/unpushed-release.sh "$IMAGE" "$VERSION"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}
            ${{ steps.newest.outputs.latest == 'true' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.title=reader
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ steps.tag.outputs.commit }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      # The page as Docker Hub shows it: without its front matter and its
      # link back to the contents.
      - name: Write the overview
        if: steps.newest.outputs.latest == 'true'
        run: sed '1,/^← /d' docs/docker.md > overview.md

      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        if: steps.newest.outputs.latest == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: A local two-pane reader and editor for a directory of markdown
          readme-filepath: overview.md
