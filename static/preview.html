<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base id="base" target="_blank">
<style id="theme"></style>
<style>
  /* the preview sits in a pane, not on a page: less top padding */
  .gm-doc { padding-top: 1.75rem; }

  /* gutter-md drops to one column below 46rem, sized for a whole window. A
   * pane is narrower than that, so keep the gutter down to phone width. */
  @media screen and (min-width: 30rem) {
    .gm-pair, .gm-colheads { grid-template-columns: var(--gm-speaker-col) var(--gm-aside-col); }
    .gm-aside-cell { margin: 0; }
    .gm-aside-cell + .gm-aside-cell { margin-top: 0.6rem; }
    .gm-colheads .gm-h-aside { display: block; }
  }
  @media screen and (max-width: 46rem) {
    :root { --gm-gutter: 1.4rem; }
    .gm-doc { padding-left: 1.1rem; padding-right: 1.1rem; }
  }

  /* a slide's steps not yet shown: hidden in the deck, faint in the
   * speaker view. Either way they keep their space, so nothing moves. */
  [data-step] { transition: opacity .18s, visibility .18s; }
  .step-hidden { visibility: hidden; opacity: 0; }
  .step-dim { opacity: .25; }

  /* the image an image link points to, shown while the link is hovered:
   * a small matted print, tipped up off the top right of the link. It's
   * flourish, not content, so it stays small. */
  .peek {
    position: fixed; z-index: 10; pointer-events: none;
    max-width: clamp(110px, 16vw, 190px); max-height: clamp(90px, 22vh, 170px);
    padding: 5px; background: var(--gm-paper, #fff);
    border: 1px solid var(--gm-rule, #d9d6d0); border-radius: 3px;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 18px rgba(0,0,0,.14);
    transform: rotate(-2deg); transform-origin: 0 100%;
    animation: peek-in .16s ease-out;
  }
  @keyframes peek-in {
    from { opacity: 0; transform: rotate(-2deg) translate(-4px, 6px) scale(.92); }
  }
</style>
</head>
<body>
<script src="/puzzles.js"></script>
<script src="/puzzles/sudoku.js"></script>
<script src="/puzzles/tracks.js"></script>
<script src="/puzzles/wordsearch.js"></script>
<script src="/puzzles/coord.js"></script>
<script src="/puzzles/maze.js"></script>
<script>
  // Loaded once, sandboxed (opaque origin): the parent posts the rendered
  // document in and this swaps it into place, keeping the scroll position.
  const theme = document.getElementById('theme');
  const base = document.getElementById('base');
  let deck = false;     // showing a slide: keys and clicks drive the deck
  let dim = false;      // steps not yet shown are faint rather than hidden

  function reveal(k) {
    for (const node of document.querySelectorAll('[data-step]')) {
      const later = Number(node.dataset.step) > k;
      node.classList.toggle('step-hidden', later && !dim);
      node.classList.toggle('step-dim', later && dim);
    }
  }

  window.addEventListener('message', (e) => {
    if (e.source !== window.parent) return;
    const m = e.data || {};
    if (m.type === 'ping') {
      window.parent.postMessage({ type: 'ready' }, '*');
    } else if (m.type === 'render') {
      const y = window.scrollY;
      if (m.base) base.href = m.base;
      if (theme.textContent !== m.css) theme.textContent = m.css;
      // A puzzle being played keeps the keyboard through the re-render, and
      // so does a field being filled in, with what's been typed so far.
      const playing = document.hasFocus() && document.activeElement?.closest?.('.puzzle');
      const filling = editing && editing.keep();
      document.body.innerHTML = m.body;
      window.Puzzles?.hydrate(document.body, playing ? Number(playing.dataset.puzzle) : null);
      if (filling) {
        const f = fieldAt(filling.line, filling.label);
        if (f) openField(f, filling);
      }
      hidePeek();
      deck = Boolean(m.deck);
      document.documentElement.classList.toggle('deck', deck);
      dim = Boolean(m.dim);
      if (m.reveal != null) reveal(m.reveal);
      if (m.resetScroll) window.scrollTo(0, 0);
      else window.scrollTo(0, y);
    } else if (m.type === 'reveal') {
      reveal(m.reveal);
    } else if (m.type === 'scroll') {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      window.scrollTo(0, Math.max(0, m.fraction * max));
    }
  });

  // In-page anchors scroll here rather than opening a new tab.
  document.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a) return;
    e.preventDefault();
    const t = document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));
    if (t) t.scrollIntoView({ behavior: 'smooth' });
  });

  // A task's checkbox asks the editor to rewrite its `[ ]`, and a radio
  // button its list's `( )`s; the re-render that follows is what makes the
  // change stick.
  document.addEventListener('change', (e) => {
    const box = e.target;
    if (!box.matches) return;
    if (box.matches('input.task-box')) {
      window.parent.postMessage({ type: 'task', line: Number(box.dataset.line), checked: box.checked }, '*');
    } else if (box.matches('input.choice-box')) {
      // A radio button says which line was chosen, and which lines are its
      // list's other choices, to be cleared.
      const group = [...document.querySelectorAll('input.choice-box')]
        .filter((b) => b.name === box.name).map((b) => Number(b.dataset.line));
      window.parent.postMessage({ type: 'choice', line: Number(box.dataset.line), group }, '*');
    }
  });

  // A form field (`@ Label: value`, a line of blank for each colon): a
  // click on its label, its blank, or beside them opens the blank for
  // typing, the text wrapping onto more lines as it needs them. Enter, or
  // clicking away, writes the value into the file; Esc puts it back as it
  // was; Tab and Shift-Tab write it and move to the next field or the one
  // before.
  let editing = null;

  const fieldLabel = (f) => f.querySelector('.field-label')?.textContent ?? '';
  const fieldAt = (line, label) => [...document.querySelectorAll('.field')]
    .find((f) => f.dataset.line === String(line) && fieldLabel(f) === label);

  function openField(field, { value, start, end } = {}) {
    const slot = field.querySelector('.field-value');
    if (!slot || slot.querySelector('textarea')) return;
    editing?.close(true);
    const before = slot.dataset.value ?? '';
    const input = document.createElement('textarea');
    input.value = value ?? before;
    input.rows = 1;
    input.setAttribute('aria-label', fieldLabel(field));
    input.spellcheck = false;
    slot.replaceChildren(input);
    const fit = () => {
      input.style.height = 'auto';
      input.style.height = `${input.scrollHeight}px`;
    };
    fit();
    input.addEventListener('input', fit);
    input.focus();
    input.setSelectionRange(start ?? input.value.length, end ?? input.value.length);

    let done = false;
    const close = (commit) => {
      if (done) return;
      done = true;
      if (editing?.input === input) editing = null;
      const after = commit ? input.value.replace(/\s+/g, ' ').trim() : before;
      slot.textContent = after;
      slot.dataset.value = after;
      if (after !== before) {
        window.parent.postMessage({ type: 'field', line: Number(field.dataset.line), before, after }, '*');
      }
    };
    // A re-render is about to replace the field: let it go quietly and say
    // how to open it again.
    const keep = () => {
      done = true;
      editing = null;
      return {
        line: field.dataset.line, label: fieldLabel(field),
        value: input.value, start: input.selectionStart, end: input.selectionEnd,
      };
    };
    editing = { input, close, keep };

    input.addEventListener('keydown', (e) => {
      if (!['Enter', 'Escape', 'Tab'].includes(e.key) || e.isComposing) return;
      e.preventDefault();
      e.stopPropagation();
      close(e.key !== 'Escape');
      if (e.key !== 'Tab') return;
      const all = [...document.querySelectorAll('.field')];
      const next = all[all.indexOf(field) + (e.shiftKey ? -1 : 1)];
      if (next) openField(next);
    });
    input.addEventListener('blur', () => close(true));
  }

  document.addEventListener('click', (e) => {
    const f = !deck && e.target.closest && e.target.closest('.field');
    if (f && !(e.target instanceof HTMLTextAreaElement)) openField(f);
  });

  // A link to an image shows the image while it's hovered.
  const IMAGE = /\.(png|jpe?g|gif|webp|svg|avif)$/i;
  const peek = document.createElement('img');
  peek.className = 'peek';
  peek.alt = '';
  let peeking = null;

  function showPeek(a) {
    peeking = a;
    // Outside <body>, which every render replaces.
    if (!peek.isConnected) document.documentElement.append(peek);
    peek.hidden = true;
    peek.onload = () => { if (peeking === a) place(a); };
    peek.src = a.href;
    if (peek.complete && peek.naturalWidth) place(a);
  }

  // Above and to the right of the link, so the link stays readable. For a
  // link that wraps, that's off the end of its first line.
  function place(a) {
    peek.hidden = false;
    const r = a.getClientRects()[0] || a.getBoundingClientRect();
    const w = peek.offsetWidth;
    const h = peek.offsetHeight;
    const gap = 8;
    const top = Math.max(gap, r.top - h - 2);
    const left = Math.max(gap, Math.min(r.right + 4, innerWidth - w - gap));
    peek.style.top = `${top}px`;
    peek.style.left = `${left}px`;
  }

  function hidePeek() {
    peeking = null;
    peek.hidden = true;
  }

  const imageLink = (t) => {
    const a = t.closest && t.closest('a[href]');
    if (!a) return null;
    try { return IMAGE.test(new URL(a.href).pathname) ? a : null; } catch { return null; }
  };
  document.addEventListener('mouseover', (e) => {
    const a = imageLink(e.target);
    if (a && a !== peeking) showPeek(a);
  });
  document.addEventListener('mouseout', (e) => {
    const a = imageLink(e.target);
    if (a && a === peeking && !a.contains(e.relatedTarget)) hidePeek();
  });
  window.addEventListener('scroll', hidePeek, { passive: true });

  // On a slide, a click anywhere but a link or a puzzle moves the deck, the
  // left third back and the rest forward.
  document.addEventListener('click', (e) => {
    if (!deck || (e.target.closest && e.target.closest('a[href], .puzzle'))) return;
    window.parent.postMessage({ type: 'click', left: e.clientX < innerWidth / 3 }, '*');
  });

  const DECK_KEYS = new Set([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End', 'Backspace']);

  // Clicking into the page gives this frame the keyboard, so pass the app's
  // shortcuts (and Esc, which leaves read mode) up to it. On a slide, pass
  // every key: they're all the deck's.
  document.addEventListener('keydown', (e) => {
    const meta = e.metaKey || e.ctrlKey;
    if (deck && !meta && !e.altKey) {
      if (DECK_KEYS.has(e.key)) e.preventDefault();
      const { key, code, metaKey, ctrlKey, altKey, shiftKey } = e;
      window.parent.postMessage({ type: 'key', key, code, metaKey, ctrlKey, altKey, shiftKey }, '*');
      return;
    }
    if (!meta && !e.altKey && e.key !== 'Escape') return;
    if ((meta && ['s', '\\'].includes(e.key.toLowerCase())) || (meta && e.code === 'Period')
      || (e.altKey && ['ArrowUp', 'ArrowDown'].includes(e.key))) e.preventDefault();
    const { key, code, metaKey, ctrlKey, altKey, shiftKey } = e;
    window.parent.postMessage({ type: 'key', key, code, metaKey, ctrlKey, altKey, shiftKey }, '*');
  });

  window.parent.postMessage({ type: 'ready' }, '*');
</script>
</body>
</html>
